name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@79b45d2aa10eff24b76ebab642bf32d36aabe8d6 # main @ 2026-10-19

  gha-security:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/gha-security.yml@79b45d2aa10eff24b76ebab642bf32d36aabe8d6 # main @ 2026-10-19

  skill-audit:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/skill-audit.yml@79b45d2aa10eff24b76ebab642bf32d36aabe8d6 # main @ 2026-10-19

  sast:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/sast.yml@79b45d2aa10eff24b76ebab642bf32d36aabe8d6 # main @ 2026-10-19

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@79b45d2aa10eff24b76ebab642bf32d36aabe8d6 # main @ 2026-10-19
