name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-10-01

  gha-security:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/gha-security.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-10-01

  skill-audit:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/skill-audit.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-10-01

  sast:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/sast.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-10-01

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-10-01
